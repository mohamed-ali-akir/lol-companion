# Tests à chaque envoi sur GitHub (push sur main, ou pull request)
# ----------------------------------------------------------------
# Avant (17/10/2026), les tests ne tournaient qu'au moment de publier une version (publier.yml) : un envoi qui cassait
# quelque chose passait inaperçu jusqu'à la publication suivante. Même PC que la publication (Windows).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    # (Depuis Electron 42, Electron n'est plus téléchargé à l'installation mais au premier lancement :
    #  les tests, qui n'ouvrent pas l'appli, ne le téléchargent donc plus du tout.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Essai de bout en bout (outils/essai-complet.js) : la vraie appli sur un faux client League, chaque onglet ouvert,
  # aucune erreur tolérée. Ici, Electron est téléchargé (il faut lancer l'appli).
  essai:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run essai

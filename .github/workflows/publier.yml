# Publication d'une nouvelle version de LoL Companion
# ---------------------------------------------------
# Déclenchée quand une étiquette de version (ex. v1.1.0) est envoyée sur GitHub, ou à la main (onglet Actions).
# Sur un PC Windows de GitHub : installe les dépendances, lance les tests, fabrique l'installateur et le publie
# dans les Releases du dépôt (avec latest.yml, que lit la mise à jour automatique de l'appli : mise-a-jour.js).
# Le jeton GITHUB_TOKEN est fourni par GitHub pour cette seule exécution : aucun secret à créer.
name: Publier une version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # créer la Release et y déposer les fichiers

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # On crée la Release AVANT electron-builder : sinon il envoie ses fichiers en parallèle et chaque envoi crée sa
      # propre Release (vu le 11/10/2026 : deux « v1.1.0 », le lien public tombait sur celle qui n'avait que le .blockmap).
      # En BROUILLON : invisible tant que les fichiers ne sont pas tous déposés (vu le 17/10/2026 : pendant la
      # fabrication de la v1.3.1, les applis trouvaient la Release sans latest.yml et affichaient une erreur).
      # Le job « rendre-publique », à la fin, la publie.
      - name: Créer la Release
        if: github.ref_type == 'tag'
        # Bloc « >- » : le texte peut contenir « : » (sinon YAML le prend pour une clé, vu le 16/10/2026).
        run: >-
          gh release create "${{ github.ref_name }}" --draft --title "LoL Companion ${{ github.ref_name }}"
          --notes "Windows : télécharge LoL-Companion-Setup-*.exe ci-dessous (les applis déjà installées se mettent à jour toutes seules).
          Mac (bêta) : LoL-Companion-*-mac.dmg, voir la section Mac du README pour l'installer."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fabriquer et publier l'installateur
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Version Mac (bêta) : APRÈS le job Windows, qui a déjà créé la Release (sinon electron-builder en créerait une
  # deuxième, comme pour la v1.1.0). Un .dmg ne se fabrique que sur un Mac. Pas de signature Apple : l'appli Mac ne
  # fait que vérifier les versions et proposer le téléchargement (mise-a-jour.js, creerVerificationMac).
  mac:
    needs: publier
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fabriquer et publier le .dmg
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tous les fichiers sont déposés : la Release sort du brouillon et devient la « dernière » (lien latest, mises à
  # jour). Même si le .dmg Mac a échoué : la version Windows est publiée quand même.
  rendre-publique:
    needs: [publier, mac]
    if: always() && needs.publier.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publier la Release
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

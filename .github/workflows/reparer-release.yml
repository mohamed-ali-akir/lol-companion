# Réparation ponctuelle (11/10/2026) : la publication de la v1.1.0 a créé deux Releases « v1.1.0 ».
# Celle qui ne contient que le .blockmap (id 409918257) passe en brouillon : invisible pour le public, rien n'est
# supprimé, et le lien « latest » retombe sur la bonne (installateur + latest.yml). Fichier retiré juste après.
name: Réparer la Release v1.1.0

on:
  push:
    paths: [".github/workflows/reparer-release.yml"]

permissions:
  contents: write

jobs:
  reparer:
    runs-on: ubuntu-latest
    steps:
      - name: Passer le doublon en brouillon
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/409918257" -F draft=true --jq '.id, .draft'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

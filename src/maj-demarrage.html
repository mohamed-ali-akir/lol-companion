<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Petite fenêtre affichée au lancement pendant l'installation d'une mise à jour (main.js, ecranMajDemarrage). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>LoL Companion</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #0a1428;
      border: 1px solid #c8aa6e;
      box-sizing: border-box;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      gap: 6px;
      justify-content: center;
      padding: 0 24px;
      -webkit-app-region: drag;
    }
    strong { color: #c8aa6e; font-family: "Palatino Linotype", Georgia, serif; font-size: 17px; }
    p { color: #8a9bb5; font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <strong>Mise à jour de LoL Companion…</strong>
  <p>La nouvelle version s'installe, l'appli redémarre toute seule dans un instant.</p>

</html>
